name: Diffusion

on:
  workflow_dispatch:
  push:
    branches: ['main']

permissions:
  contents: read

env:
  # Koharu's patches on top of upstream stable-diffusion.cpp.
  SOURCE_REPOSITORY: perennialtech/stable-diffusion.cpp
  SOURCE_COMMIT: c72cfa8dccd53b49570f958dbf6060daf32dca98

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    name: Resolve release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      release_tag: ${{ steps.release.outputs.release_tag }}

    steps:
      - name: Name the release after the source commit
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=koharu-${SOURCE_COMMIT::7}
          existing_tags=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[].tag_name')
          release_tag=$tag
          suffix=1
          while grep -Fxq "$release_tag" <<< "$existing_tags"; do
            release_tag="$tag.$suffix"
            ((suffix += 1))
          done
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
          printf 'release_tag=%s\n' "$release_tag" >> "$GITHUB_OUTPUT"

  build:
    needs: source
    name: cuda / x86_64-unknown-linux-gnu
    runs-on: ubuntu-24.04
    env:
      # mozilla/sccache#2809 merge snapshot also includes #2722 and #2811.
      SCCACHE_REV: a91b5c1c5566c1d5abd9a2a662cf37fde07236cb
      SCCACHE_GHA_ENABLED: 'true'
      SCCACHE_IGNORE_SERVER_IO_ERROR: '1'
      PACKAGE: x86_64-unknown-linux-gnu-cuda

    steps:
      - uses: actions/checkout@v7

      - name: Cache sccache
        id: sccache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/sccache
          key: sccache-${{ runner.os }}-${{ runner.arch }}-${{ env.SCCACHE_REV }}-gha

      - name: Build sccache
        if: steps.sccache.outputs.cache-hit != 'true'
        run: |
          cargo install --locked \
            --git https://github.com/mozilla/sccache \
            --rev "$SCCACHE_REV" \
            --no-default-features --features gha \
            --root "$RUNNER_TEMP/sccache" sccache

      - name: Configure sccache
        uses: actions/github-script@v9
        with:
          script: |
            core.addPath(`${process.env.RUNNER_TEMP}/sccache/bin`);
            core.exportVariable('ACTIONS_CACHE_SERVICE_V2', 'on');
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Check out stable-diffusion.cpp
        uses: actions/checkout@v7
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ env.SOURCE_COMMIT }}
          path: upstream/stable-diffusion.cpp
          # ggml vendors CUTLASS as a submodule of its own.
          submodules: recursive

      - name: Install CUDA 13.3
        uses: Jimver/cuda-toolkit@master
        with:
          cuda: '13.3.1'
          method: network
          sub-packages: '["nvcc", "cudart", "crt", "thrust"]'
          non-cuda-sub-packages: '["libcublas", "libcublas-dev"]'

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            ninja-build

      - name: Configure
        # 86-real covers only the RTX 3080 that runs Koharu. Each extra
        # architecture adds most of an hour of kernel compiles, and without
        # PTX other NVIDIA GPUs can't load this build.
        run: |
          cmake -S upstream/stable-diffusion.cpp -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CUDA_COMPILER_LAUNCHER=sccache \
            -DSD_BUILD_SHARED_LIBS=ON \
            -DSD_BUILD_SHARED_GGML_LIB=OFF \
            -DSD_BUILD_EXAMPLES=OFF \
            -DSD_WEBP=OFF \
            -DSD_WEBM=OFF \
            -DGGML_BACKEND_DL=OFF \
            -DGGML_CPU_ALL_VARIANTS=OFF \
            -DGGML_CPU_REPACK=OFF \
            -DGGML_CUDA_NCCL=OFF \
            -DGGML_NATIVE=OFF \
            -DGGML_OPENMP=OFF \
            -DSD_CUDA=ON \
            -DCMAKE_CUDA_ARCHITECTURES=86-real

      - name: Build stable-diffusion
        timeout-minutes: 300
        run: cmake --build build --target stable-diffusion

      - name: Package stable-diffusion
        run: |
          mkdir package
          cp build/bin/*stable-diffusion.* package/
          tar -C package -czf "$PACKAGE.tar.gz" .

      - name: Stop sccache
        if: always()
        run: |
          sccache --show-stats || true
          sccache --stop-server || true

      - name: Upload stable-diffusion
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PACKAGE }}
          path: ${{ env.PACKAGE }}.tar.gz
          if-no-files-found: error
          retention-days: 3

  release:
    needs: [source, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download stable-diffusion builds
        uses: actions/download-artifact@v8
        with:
          pattern: '*'
          path: release
          merge-multiple: true

      - name: Publish stable-diffusion release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.source.outputs.release_tag }}
          target_commitish: ${{ github.event.repository.default_branch }}
          name: Diffusion ${{ needs.source.outputs.release_tag }}
          body: Koharu runtime dependency.
          fail_on_unmatched_files: true
          files: release/*.tar.gz
